name: Semantic Release
description: Executa Semantic Release usando linters/releaserc.json

inputs:
  github_token:
    description: Token GitHub para criacao de tags e releases
    required: true

runs:
  using: composite
  steps:
    - name: Configurar Node.js
      uses: actions/setup-node@v4
      with:
        node-version: "22"

    - name: Executar Semantic Release
      shell: bash
      env:
        GITHUB_TOKEN: ${{ inputs.github_token }}
      run: |
        SR_DIR="${{ runner.temp }}/semantic-release"
        npm install --no-save --prefix "$SR_DIR" \
          semantic-release \
          @semantic-release/commit-analyzer \
          @semantic-release/release-notes-generator \
          @semantic-release/changelog \
          @semantic-release/git \
          @semantic-release/github \
          "conventional-changelog-conventionalcommits@^8.0.0"
        NODE_PATH="$SR_DIR/node_modules" "$SR_DIR/node_modules/.bin/semantic-release" --extends ./linters/releaserc.json
