name: Pipeline Summary
description: Publica resumo da execucao dos jobs no GitHub Step Summary

inputs:
  commitlint:
    required: false
    default: "skipped"
    type: string
  python:
    required: true
    type: string
  workflows:
    required: true
    type: string
  release:
    required: true
    type: string

runs:
  using: composite
  steps:
    - name: Escrever resumo
      shell: bash
      run: |
        {
          echo "## Resumo da Pipeline CI/CD"
          echo ""
          echo "| Job | Status |"
          echo "|---|---|"
          echo "| CI - Commitlint | ${{ inputs.commitlint }} |"
          echo "| CI - Python (Lint, Validate, Security, Test, Build) | ${{ inputs.python }} |"
          echo "| CI - Workflows | ${{ inputs.workflows }} |"
          echo "| CI - Release | ${{ inputs.release }} |"
        } >> "$GITHUB_STEP_SUMMARY"
