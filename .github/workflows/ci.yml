name: CI/CD - Pipeline principal

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

on:
  push:
    branches: [main]
    paths:
      - ".github/**"
      - ".pre-commit-config.yaml"
      - ".yamllint.yaml"
      - "linters/**"
      - "Makefile"
      - "README.md"
      - "AGENTS.md"
      - "docs/**"
      - "pyproject.toml"
      - "scripts/**"
      - "src/**"
      - "tests/**"
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  commitlint:
    name: CI - Commitlint
    if: >-
      ${{ github.event_name != 'push' || (github.event.head_commit != null &&
      !contains(github.event.head_commit.message, 'Merge branch') &&
      !contains(github.event.head_commit.message, 'merge origin/')) }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Obter codigo fonte
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Commitlint | Conventional Commits
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            npx --yes -p @commitlint/cli -p @commitlint/config-conventional \
              commitlint --config linters/commitlint.config.mjs \
              --from "origin/${{ github.base_ref }}" --to "HEAD" --verbose
          else
            git log -1 --pretty=format:"%B" | \
              npx --yes -p @commitlint/cli -p @commitlint/config-conventional \
              commitlint --config linters/commitlint.config.mjs --verbose
          fi

  python:
    name: CI - Python
    if: >-
      ${{ github.event_name != 'push' || (github.event.head_commit != null &&
      !contains(github.event.head_commit.message, 'Merge branch') &&
      !contains(github.event.head_commit.message, 'merge origin/')) }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Obter codigo fonte
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Setup Python
        uses: ./.github/actions/ci/setup-python

      - name: Preparar PATH local
        shell: bash
        run: |
          mkdir -p "$HOME/.local/bin"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Cache Gitleaks
        id: cache-gitleaks
        uses: actions/cache@v4
        with:
          path: ~/.local/bin/gitleaks
          key: gitleaks-8.24.2-linux-x64

      - name: Instalar Gitleaks
        if: steps.cache-gitleaks.outputs.cache-hit != 'true'
        shell: bash
        run: |
          GITLEAKS_VERSION="8.24.2"
          GITLEAKS_URL="https://github.com/gitleaks/gitleaks/releases/download"
          curl -sSL "${GITLEAKS_URL}/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
            -o /tmp/gitleaks.tar.gz
          tar -xzf /tmp/gitleaks.tar.gz -C /tmp
          mv /tmp/gitleaks "$HOME/.local/bin/gitleaks"
          chmod +x "$HOME/.local/bin/gitleaks"

      - name: Python | Lint
        shell: bash
        run: python scripts/operations/clean_workspace.py --area python --stage lint

      - name: Python | Validate
        shell: bash
        run: python scripts/operations/clean_workspace.py --area python --stage validate

      - name: Python | Seguranca
        shell: bash
        run: python scripts/operations/clean_workspace.py --area python --stage security

      - name: Python | Testes
        shell: bash
        run: python scripts/operations/clean_workspace.py --area python --stage test --coverage-fail-under 100

      - name: Python | Build
        shell: bash
        run: python scripts/operations/clean_workspace.py --area python --stage build

      - name: Limpeza (caches e artefatos locais)
        shell: bash
        run: python scripts/operations/clean_workspace.py --area python --stage clean

  workflows:
    name: CI - Workflows
    if: >-
      ${{ github.event_name != 'push' || (github.event.head_commit != null &&
      !contains(github.event.head_commit.message, 'Merge branch') &&
      !contains(github.event.head_commit.message, 'merge origin/')) }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Obter codigo fonte
        uses: actions/checkout@v4
      - name: Workflows | Lint
        uses: ./.github/actions/ci/workflows

  release:
    name: CI - Release
    needs: [commitlint, python, workflows]
    if: >-
      ${{ (github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'push' && github.event.head_commit != null &&
      !contains(github.event.head_commit.message, 'Merge branch') &&
      !contains(github.event.head_commit.message, 'merge origin/'))) &&
      github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      issues: write
    steps:
      - name: Obter codigo fonte
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true
      - name: Release | Semantic
        uses: ./.github/actions/ci/release
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}

  pipeline-summary:
    name: CI - Resumo
    needs: [commitlint, python, workflows, release]
    if: always() && (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Obter codigo fonte
        uses: actions/checkout@v4
      - name: Resumo | Pipeline
        uses: ./.github/actions/ci/pipeline-summary
        with:
          commitlint: ${{ needs.commitlint.result }}
          python: ${{ needs.python.result }}
          workflows: ${{ needs.workflows.result }}
          release: ${{ needs.release.result }}
